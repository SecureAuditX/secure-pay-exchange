<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | FinCryptiX</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/LoginStyle.css" />
    <script
      src="https://kit.fontawesome.com/your-font-awesome-kit-id.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="background-overlay"></div>

    <a href="/html/Fincryptix.html" class="back-home">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <a href="#" class="logo">FinCryptiX</a>
          <h1>Create Account</h1>
          <p>Join the future of decentralized finance</p>
        </div>

        <form id="signupForm">
          <div class="input-grid">
            <div class="input-group">
              <label for="fullname">Full Name</label>
              <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="John Doe"
              />
              <span id="fullname-error" class="error"></span>
            </div>

            <div class="input-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="johndoe123"
              />
              <span id="username-error" class="error"></span>
            </div>

            <div class="input-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="john@example.com"
              />
              <span id="email-error" class="error"></span>
            </div>

            <div class="input-group">
              <label for="phonenumber">Phone Number</label>
              <input
                type="text"
                id="phonenumber"
                name="phonenumber"
                placeholder="+1 (555) 000-0000"
              />
              <span id="phonenumber-error" class="error"></span>
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
              />
              <span id="password-error" class="error"></span>
            </div>

            <div class="input-group">
              <label for="re-password">Confirm Password</label>
              <input
                type="password"
                id="re-password"
                name="re-password"
                placeholder="••••••••"
              />
              <span id="re-password-error" class="error"></span>
            </div>
          </div>

          <div class="gender-selection">
            <label>Gender</label>
            <div class="radio-group">
              <label class="radio-container">
                <input type="radio" name="gender" value="male" />
                <span class="checkmark"></span> Male
              </label>
              <label class="radio-container">
                <input type="radio" name="gender" value="female" />
                <span class="checkmark"></span> Female
              </label>
            </div>
            <span id="gender-error" class="error"></span>
          </div>

          <div class="input-group full-width">
            <label for="recovered-email">Recovery Email</label>
            <input
              type="email"
              id="recovered-email"
              name="recovered-email"
              placeholder="backup@example.com"
            />
            <span id="recovered-email-error" class="error"></span>
          </div>

          <button type="submit" class="submit-btn shadow-btn">
            Create Account
          </button>

          <p class="login-footer">
            Already have an account? <a href="#">Log in</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          // Clear previous error messages
          const errorElements = document.querySelectorAll(".error");
          errorElements.forEach((el) => (el.textContent = ""));

          // Get form values
          const fullname = document.getElementById("fullname").value.trim();
          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
          const rePassword = document
            .getElementById("re-password")
            .value.trim();
          const gender = document.querySelector('input[name="gender"]:checked');
          const phonenumber = document
            .getElementById("phonenumber")
            .value.trim();
          const recoveredEmail = document
            .getElementById("recovered-email")
            .value.trim();

          let isValid = true;

          const validate = (id, message) => {
            document.getElementById(id + "-error").textContent = message;
            isValid = false;
          };

          if (fullname === "") validate("fullname", "Full Name is required.");
          if (username === "") validate("username", "Username is required.");
          if (!email.includes("@"))
            validate("email", "Valid email is required.");
          if (password.length < 6)
            validate("password", "Min 6 characters required.");
          if (password !== rePassword)
            validate("re-password", "Passwords do not match.");
          if (!gender) validate("gender", "Gender is required.");
          if (phonenumber === "")
            validate("phonenumber", "Phone Number is required.");
          if (recoveredEmail === "")
            validate("recovered-email", "Recovery email is required.");

          if (isValid) {
            // Simulating success
            const btn = document.querySelector(".submit-btn");
            btn.textContent = "Creating Account...";
            btn.disabled = true;
            setTimeout(() => {
              window.location.href = "/html/Dashboard.html";
            }, 1500);
          }
        });
    </script>
  </body>
</html>
